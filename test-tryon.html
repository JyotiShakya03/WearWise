
<!DOCTYPE html>
<html>
<head>
  <title>WearWise AI Try-On Test</title>
</head>
<body>
  <h2>WearWise Virtual Try-On Test</h2>

  <form id="tryOnForm">
    <p>
      <label>Person Image:</label>
      <input type="file" id="person" accept="image/*" required>
    </p>

    <p>
      <label>Garment Image:</label>
      <input type="file" id="garment" accept="image/*" required>
    </p>

    <p>
      <label>Category:</label>
      <select id="category">
        <option value="one-pieces">One Pieces (Gown)</option>
        <option value="tops">Tops</option>
        <option value="bottoms">Bottoms</option>
      </select>
    </p>

    <button type="submit" id="submitBtn">Generate Try-On</button>
  </form>

  <p id="status"></p>
  <div id="result"></div>

  <script>
    const form = document.getElementById("tryOnForm");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const person = document.getElementById("person").files[0];
      const garment = document.getElementById("garment").files[0];
      const category = document.getElementById("category").value;

      const data = new FormData();
      data.append("person_image", person);
      data.append("garment_image", garment);
      data.append("category", category);

      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const button = document.getElementById("submitBtn");

      button.disabled = true;
      status.textContent = "Generating AI try-on... Please wait.";
      result.innerHTML = "";

      try {
        const response = await fetch(
          "http://localhost:5000/api/ai/tryon",
          {
            method: "POST",
            body: data
          }
        );

        if (!response.ok) {
          const error = await response.text();
          throw new Error(error);
        }

        const imageBlob = await response.blob();
        const imageURL = URL.createObjectURL(imageBlob);

        const image = document.createElement("img");
        image.src = imageURL;
        image.style.maxWidth = "450px";

        result.appendChild(image);
        status.textContent = "AI Try-On Generated Successfully!";

      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
